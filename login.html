<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        .login-card {
            width: 780px;
            height: 420px;
        }

        .left-side {
            width: 45%;
            background-color: #e8a04a;
        }

        .pos-btn {
            background-color: #6b2f2f;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px 30px;
            font-weight: 600;
        }

        .input-wrapper input {
            width: 100%;
            background-color: #fde8e8;
            border: none;
            border-bottom: 2px solid #c0a0a0;
            border-radius: 4px;
            padding: 8px 10px;
            outline: none;
        }

        .password-field {
            position: relative;
        }
        .password-field input {
            padding-right: 36px;
        }
        .toggle-eye {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
        }

        .signin-btn {
            border: 2px solid #c8a060;
            border-radius: 8px;
            background: transparent;
            color: #333;
            cursor: pointer;
        }
        .signin-btn:hover {
            background-color: #e8a04a;
            color: #fff;
            border-color: #e8a04a;
        }
    </style>

</head>
<body class="vh-100 d-flex align-items-center justify-content-center bg-light">

<div class="login-card d-flex rounded-3 overflow-hidden shadow">

    <!-- Left Side  -->
    <div class="left-side d-flex flex-column align-items-center justify-content-center gap-4">
        <h2 class="fst-italic fw-bold">Welcome Back...</h2>
        <button class="pos-btn">POS System</button>
    </div>

    <!-- Right Side  -->
    <div class="d-flex flex-column justify-content-center p-5 gap-3 bg-white flex-fill">
        <p class="fst-italic text-muted mb-0">Log in to continue...</p>

        <!-- Username  -->
        <div class="d-flex align-items-center gap-3">
            <i class="bi bi-person fs-4"></i>
            <div class="input-wrapper">
                <label class="fw-semibold small">Username :</label>
                <input type="text" id="username_input" autocomplete="off">
            </div>
        </div>

        <!-- Password -->
        <div class="d-flex align-items-center gap-3">
            <i class="bi bi-lock fs-4"></i>
            <div class="input-wrapper">
                <label class="fw-semibold small">Password :</label>
                <div class="password-field">
                    <input type="password" id="password_input">
                    <i class="bi bi-eye-slash toggle-eye" id="toggle_eye"></i>
                </div>
            </div>
        </div>

        <!-- Sign In -->
        <button class="signin-btn d-flex align-items-center justify-content-between px-3 py-2 fw-semibold" id="signin_btn">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-arrow-right-circle"></i>
                <span>Sign in</span>
            </div>
            <i class="bi bi-box-arrow-in-right"></i>
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="controller/AuthenticationController.js"></script>

</body>
</html>
