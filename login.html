<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Pacifico&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/styles/styles.css">
</head>

<body>



<!--  SUCCESS OVERLAY -->
<div id="success_overlay">
    <div class="spinner-border text-white" style="width:48px;height:48px;" role="status"></div>
    <p>Login successful! Redirecting...</p>
</div>

<!--LOGIN CARD -->
<div class="login-wrapper">

    <!-- LEFT PANEL -->
    <div class="left-panel">
        <div class="brand-logo"><span>Arts & Crafts</span>POS</div>
        <!--        <div class="welcome-icon">🛒</div>-->
        <h2>Welcome Back...</h2>
        <p>Sign in to manage your<br>customers, items & orders.</p>
        <div class="pos-badge">Point of Sale System </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
        <p class="login-heading">Log in to continue...</p>
        <h3>Sign In</h3>
        <p class="text-muted mb-4" style="font-size:13px;">Enter your credentials to access the dashboard.</p>

        <!-- ERROR ALERT -->
        <div class="alert alert-danger" id="login_error" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span id="login_error_msg">Invalid username or password.</span>
        </div>

        <!--  FORM -->
        <form id="login_form" novalidate>

            <!-- Username Row -->
            <div class="row mb-3 align-items-center">
                <label for="login_username" class="col-sm-3 col-form-label fw-semibold">
                    Username :
                </label>
                <div class="col-sm-9">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person-fill"></i>
                        </span>
                        <input type="text" class="form-control" id="login_username" placeholder="Enter username" autocomplete="off" required>
                    </div>
                </div>
            </div>

            <!-- Password Row -->
            <div class="row mb-4 align-items-center">
                <label for="login_password" class="col-sm-3 col-form-label fw-semibold">
                    Password :
                </label>
                <div class="col-sm-9">
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password" class="form-control pw-input" id="login_password" placeholder="Enter password" required>
                        <button class="toggle-pw" type="button" id="toggle_pw_btn" title="Show/hide password">
                            <i class="bi bi-eye-slash" id="toggle_pw_icon"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Remember me + Sign in row -->
            <!--            <div class="row align-items-center">-->
            <!--                <div class="col-sm-3">-->
            <!--                    <div class="form-check">-->
            <!--                        <input class="form-check-input" type="checkbox" id="remember_me">-->
            <!--                        <label class="form-check-label" for="remember_me">Remember me</label>-->
            <!--                    </div>-->
            <!--                </div>-->

<!--            Sign in button-->
            <div class="col-sm-9 d-flex align-items-center gap-3 flex-wrap">
                <button type="button" class="btn-signin" id="login_btn">
                    <span class="spinner-border" role="status" aria-hidden="true"></span>
                    Sign in
                    <i class="bi bi-arrow-right btn-arrow"></i>
                </button>
                <div>
                    <i class="bi bi-arrow-repeat text-muted" style="font-size:20px; cursor:pointer;" title="Reset" id="reset_btn"></i>
                </div>
            </div>
            <!--            </div>-->

        </form>

    </div>

</div>




<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>








</body>
</html>
