<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Pacifico&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/styles/styles.css">



</head>

<body>

// navbar
<header>
    <nav id="navbar" class="navbar navbar-expand-lg bg-primary position-fixed w-100 top-0">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">IJSE</a>
            <button id="menu_btn" type="button" class="btn btn-info">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>
</header>


// side bar
<main>
    <aside id="sidebar" class="position-fixed bottom-0 margin-auto bg-primary-subtle">
        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
            <li class="nav-item m-2">
                <div class="nav-link" >Dashboard</div>
            </li>
            <li class="nav-item m-2 text-primary" id="student_sidebar_tab">
                <div class="nav-link">Customer Management</div>
            </li>
            <li class="nav-item m-2" id="course_sidebar_tab">
                <div class="nav-link">Item Management</div>
            </li>
            <li class="nav-item m-2">
                <div class="nav-link">Order Management</div>
            </li>
            <li class="nav-item m-2">
                <div class="nav-link">Logout</div>
            </li>
        </ul>
    </aside>

    // customer management
    <section id="customer_content" class="content p-5">

        <form class="w-50 m-auto">
            <h1 class="text-center">Customer Management</h1>
            <div class="mb-3">
                <label for="customer_id_input" class="form-label">ID</label>
                <input type="number" class="form-control" id="customer_id_input">
            </div>
            <div class="mb-3">
                <label for="customer_name_input" class="form-label">Name</label>
                <input type="text" class="form-control" id="customer_name_input">
            </div>
            <div class="mb-3">
                <label for="customer_contact_input" class="form-label">Contact</label>
                <input type="text" class="form-control" id="customer_contact_input">
            </div>
            <div class="mb-3">
                <label for="customer_address_input" class="form-label">Address</label>
                <textarea class="form-control" id="customer_address_input" style="height: 100px"></textarea>
            </div>
            <div class="text-end">
                <button type="button" id="customer_save_btn" class="btn btn-success">Save</button>
                <button type="button" id="customer_update_btn" class="btn btn-primary">Update</button>
                <button type="button" id="customer_delete_btn" class="btn btn-danger">Delete</button>
                <button type="reset" id="customer_reset_btn" class="btn btn-info">Reset</button>
            </div>
        </form>

        <table class="table m-5">
            <thead>
            <tr>
                <th scope="col">#ID</th>
                <th scope="col">Name</th>
                <th scope="col">Contact</th>
                <th scope="col">Address</th>
            </tr>
            </thead>
            <tbody id="customer_tbody">

            </tbody>
        </table>

    </section>

</main>



<script>

</script>


</body>
</html>
